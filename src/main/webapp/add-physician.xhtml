<?xml version="1.0" encoding="ISO-8859-1" ?>
<!DOCTYPE html>
<html
  lang="en"
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:jsf="http://xmlns.jcp.org/jsf"
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  >
  <!-- View that adds new physician -->

  <h:head>
    <!-- Title of tab/window in browser -->
    <title>#{uiconsts['addButtonLabel']}</title>
  </h:head>
  <h:body>
    <h2>#{uiconsts['addButtonLabel']}</h2>
    <br/>
    <p>Create a physician here.  You can use "h:panelGrid", "h:outputText", "h:inputText", ""h:selectOneMenu", "f:selectItems", "h:commandButton", "h:form", and "h:outputLink"</p>
    
    <h:form>

	    <h:outputText value="#{uiconsts['columnLabel_FirstName']}" />
	    <h:inputText value="#{newPhysician.firstName}"/>
	
		<br />
		
	    <h:outputText value="#{uiconsts['columnLabel_LastName']}" />
	    <h:inputText value="#{newPhysician.lastName}"/>
	
		<br />
		
	    <h:outputText value="#{uiconsts['columnLabel_Email']}" />
	    <h:inputText value="#{newPhysician.email}"/>
	    
	    <br />
	    
	    <h:outputText value="#{uiconsts['columnLabel_PhoneNumber']}" />
	    <h:inputText value="#{newPhysician.phoneNumber}"/>
	    
	    <br />
	    
	    <h:outputText value="#{uiconsts['columnLabel_Specialty']}" />
	    <h:selectOneMenu value="#{newPhysician.specialty}">
            <f:selectItems value="#{physicianController.specialties}" />
        </h:selectOneMenu>
	    
	    <br />
	    
	    <h:commandButton value="#{uiconsts['submitButtonLabel']}"
	    	action="#{physicianController.submitPhysician(newPhysician)}" />
	    <h:outputLink value="list-physicians.xhtml">Back</h:outputLink>
    
    </h:form>
    
    <p>Add a hyperlink to return to list-physicians.xhtml</p>
  </h:body>
</html>
